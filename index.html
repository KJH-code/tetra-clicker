<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Tetra Clicker</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="backdrop" aria-hidden="true"></canvas>
    <canvas id="coins" aria-hidden="true"></canvas>
    <div id="milestone" aria-live="polite" hidden></div>
    <div id="app">
      <section id="manual-pane" class="pane">
        <canvas id="manual-board"></canvas>
        <div id="touch" aria-label="Touch controls">
          <button data-action="hold">HOLD</button>
          <button data-action="rotateCCW">⟲</button>
          <button data-action="rotate180">180</button>
          <button data-action="rotateCW">⟳</button>
          <button data-action="hardDrop" class="wide">DROP</button>
          <button data-action="left">◀</button>
          <button data-action="softDrop">▼</button>
          <button data-action="right">▶</button>
        </div>
      </section>
      <section id="auto-pane" class="pane">
        <div id="auto-boards"></div>
      </section>
      <aside id="shop-pane" class="pane"></aside>
    </div>
    <nav id="tabs">
      <button data-tab="board" class="on">BOARD</button>
      <button data-tab="bots">BOTS</button>
      <button data-tab="shop">SHOP</button>
    </nav>
    <div id="settings-overlay" hidden></div>
    <div id="ascend-overlay" hidden></div>
    <div id="achievements-overlay" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
